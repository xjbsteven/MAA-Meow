name: Build Dev APK

on:
  push:
    branches:
      - main
      - dev
      - integration/official-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maa_repo:
        description: 'MAA Core GitHub repo (owner/repo)'
        required: false
        default: 'MaaAssistantArknights/MaaAssistantArknights'
      maa_tag:
        description: 'MAA Core release tag'
        required: false
        default: 'latest'
      maafw_tag:
        description: 'MaaFramework tag to override libMaaAndroidNativeControlUnit.so (empty = keep the one bundled by MAA)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OCR conversion deps
        run: python -m pip install -r scripts/requirements.txt

      - name: Download and deploy MAA Core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_ARG=""
          MAA_TAG="${{ github.event.inputs.maa_tag }}"
          if [ "${{ github.ref_name }}" = "integration/official-20261102" ]; then MAA_TAG="v6.21.1"; fi
          if [ -n "$MAA_TAG" ] && [ "$MAA_TAG" != "latest" ]; then
            TAG_ARG="--tag $MAA_TAG"
          fi
          MAA_REPO="${{ github.event.inputs.maa_repo }}"
          REPO_ARG=""
          if [ -n "$MAA_REPO" ]; then
            REPO_ARG="--repo $MAA_REPO"
          fi
          MAAFW_ARG=""
          MAAFW_TAG="${{ github.event.inputs.maafw_tag }}"
          if [ -n "$MAAFW_TAG" ]; then
            MAAFW_ARG="--maafw-tag $MAAFW_TAG"
          fi
          python scripts/setup_maa_core.py --clean $TAG_ARG $REPO_ARG $MAAFW_ARG

      - name: Checkout matching custom Core source
        if: github.ref_name == 'integration/official-20261102'
        uses: actions/checkout@v7
        with:
          repository: xjbsteven/MaaAssistantArknights
          ref: integration/official-20261102
          path: custom-core
          fetch-depth: 0

      - name: Setup NDK for custom Core
        if: github.ref_name == 'integration/official-20261102'
        id: custom-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Compile and stage matching custom Core
        if: github.ref_name == 'integration/official-20261102'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd custom-core
          git submodule update --init --depth 1 src/MaaUtils
          python3 tools/maadeps-download.py arm64-android
          CORE_SHA=$(git rev-parse HEAD)
          CORE_VERSION="v6.21.1-custom.${CORE_SHA:0:12}"
          cmake -B build --preset android-publish-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.custom-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DMAA_HASH_VERSION="$CORE_VERSION"
          cmake --build build --parallel 4
          cmake --install build --prefix install
          test -s install/libMaaCore.so
          test -s install/libMaaUtils.so
          test -s install/resource/tasks/tasks.json
          cd ..
          CORE_VERSION="v6.21.1-custom.$(git -C custom-core rev-parse --short=12 HEAD)"
          cp custom-core/install/libMaaCore.so app/src/main/jniLibs/arm64-v8a/libMaaCore.so
          cp custom-core/install/libMaaUtils.so app/src/main/jniLibs/arm64-v8a/libMaaUtils.so
          cp -R custom-core/install/resource/. app/src/main/assets/MaaSync/MaaResource/
          rm -rf app/src/main/jniLibs/x86_64
          printf '%s\n' "$CORE_VERSION" > .maaversion
          python3 - <<'PY'
          from pathlib import Path
          import json
          version = Path('.maaversion').read_text().strip()
          library = Path('app/src/main/jniLibs/arm64-v8a/libMaaCore.so').read_bytes()
          assert version.encode() in library, 'APK Core binary is not custom build'
          tasks = json.loads(Path('app/src/main/assets/MaaSync/MaaResource/tasks/tasks.json').read_text())
          for key in ('InfrastEnterPresetPage', 'InfrastPresetSwitchButton', 'InfrastRewardRecycleProduct'):
              assert key in tasks, f'missing Core task {key}'
          print('Custom Core identity verified:', version)
          PY

      - name: Print MAA Resource version
        run: cat app/src/main/assets/MaaSync/MaaResource/version.json

      - name: Print MaaFramework control unit version
        run: python scripts/print_maafw_version.py

      - name: Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Run Android unit and custom protocol tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        env:
          # fork 的 PR 拿不到 secret，构建出来的包不带遥测
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
